name: eval-harness

# The eval harness is the project's regression net. This
# workflow runs it against the PUBLIC synthetic demo corpus (JOURNAL_DEMO=1) so CI
# never touches private journal data, and gates merges on a clean pass -> fail.
#
#   PR gate   : deterministic layers only (routing / retrieval / answer) — cheaper than
#               the judged run, but NOT deterministic end to end: it drives the real
#               agent, so it needs the API key and its output varies run to run.
#               Runs only for trusted same-repository PRs because GitHub does not pass
#               Actions secrets to fork or Dependabot pull requests. The separate
#               quality workflow still validates those PRs without secrets.
#               Runs 3x/case for exactly that reason. At 1 run a case is scored
#               pass/fail with no middle, so one unlucky sample of a genuinely unstable
#               case reads as a clean pass -> fail and red-X's an unrelated PR. With 3
#               runs an unstable case scores flaky, which this gate warns on instead of
#               failing. Fails only on a clean pass -> fail vs baseline_demo.json.
#   Full run  : manual only (Actions -> Run workflow). Full run with the LLM judges,
#               3 runs/case for variance; posts a scoreboard to the run summary. Kept
#               out of a schedule on purpose — no unattended quota spend.
#
# REQUIRED REPO SECRET: GEMINI_API_KEY  (Settings -> Secrets and variables -> Actions).
# Until baseline_demo.json is committed the gate is inert (it warns and passes).

on:
  pull_request:
    paths:
      - "agent.py"
      - "chroma_search.py"
      - "query_constructor.py"
      - "router.py"
      - "period_analysis.py"
      - "llm_client.py"
      - "chunk.py"
      - "database.py"
      - "config.py"
      - "evals/**"
      - "demo/**"
      - "requirements.txt"
      - ".github/workflows/eval-harness.yml"
  workflow_dispatch: {} # manual full run from the Actions tab (no schedule on purpose)

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JOURNAL_DEMO: "1"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  # ---------------------------------------------------------------- PR gate
  gate:
    # PR check: deterministic layers, blocks merge on a clean pass -> fail
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 3 runs/case triples the agent calls, and Gemini rate-limit backoff adds wall
    # time on top, so the old 20m ceiling is too tight.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build demo index (deterministic, no API key)
        run: |
          python demo/generate_demo_corpus.py   # self-verifies ground truths
          python chunk.py
          python database.py

      - name: Eval gate (deterministic layers, 3 runs/case for variance)
        run: python -m evals.ci_gate --runs 3

  # ---------------------------------------------------------------- full run (manual)
  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build demo index (deterministic, no API key)
        run: |
          python demo/generate_demo_corpus.py
          python chunk.py
          python database.py

      - name: Full eval (judges + variance)
        run: |
          python -m evals.ci_gate --judge --runs 3 | tee eval_output.txt
          {
            echo '## Full eval scoreboard'
            echo '```'
            sed -n '/SCOREBOARD/,/=====/p' eval_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
